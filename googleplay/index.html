<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#0d0f14">

    <title>Kervan Games – Oyunlarımız (Google Play)</title>
    <meta name="description" content="Kervan Games tarafından geliştirilen mobil oyunları keşfedin ve Google Play'den indirin.">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Kervan Games">
    <meta property="og:title" content="Kervan Games – Oyunlarımız (Google Play)">
    <meta property="og:description" content="Kervan Games tarafından geliştirilen mobil oyunları keşfedin ve Google Play'den indirin.">

    <style>
        :root {
            color-scheme: dark;
            --bg: #0d0f14;
            --surface: #16181f;
            --surface-hover: #1c1f28;
            --border: rgba(255, 255, 255, 0.08);
            --ink: #f2f2f2;
            --muted: #9aa0ab;
            --accent: #34a853;
            --accent-hover: #4caf62;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .wrap {
            width: min(100%, 860px);
            margin: 0 auto;
            padding: 0 20px;
        }

        header.page-header {
            padding: 48px 0 32px;
            border-bottom: 1px solid var(--border);
        }

        .brand {
            margin: 0 0 18px;
            font-size: 15px;
            font-weight: 700;
            color: var(--muted);
        }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(28px, 4.5vw, 38px);
            letter-spacing: -0.02em;
        }

        .lead {
            margin: 0;
            max-width: 60ch;
            color: var(--muted);
            font-size: 15.5px;
            line-height: 1.6;
        }

        .store-switch {
            margin: 16px 0 0;
            font-size: 13.5px;
        }

        .store-switch a {
            color: var(--accent-hover);
            text-decoration: none;
        }

        .store-switch a:hover {
            text-decoration: underline;
        }

        main {
            padding: 32px 0 40px;
        }

        .status {
            display: flex;
            min-height: 140px;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            text-align: center;
            font-size: 15px;
        }

        .status[hidden],
        .skeletons[hidden],
        .apps[hidden] {
            display: none;
        }

        .loader {
            width: 24px;
            height: 24px;
            margin: 0 auto 12px;
            border: 3px solid rgba(255, 255, 255, 0.12);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .loader {
                animation-duration: 1.6s;
            }
        }

        .apps {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .skeletons {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .skeleton-card {
            display: flex;
            gap: 16px;
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
        }

        .skeleton-icon,
        .skeleton-line {
            border-radius: 8px;
            background: linear-gradient(100deg, var(--surface-hover) 30%, rgba(255, 255, 255, 0.08) 50%, var(--surface-hover) 70%);
            background-size: 200% 100%;
            animation: shimmer 1.4s ease-in-out infinite;
        }

        @keyframes shimmer {
            0% { background-position: 140% 0; }
            100% { background-position: -40% 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .skeleton-icon,
            .skeleton-line {
                animation: none;
                background: var(--surface-hover);
            }
        }

        .skeleton-icon {
            width: 72px;
            height: 72px;
            flex: 0 0 72px;
            border-radius: 16px;
        }

        .skeleton-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            justify-content: center;
        }

        .skeleton-line--wide { width: 60%; height: 12px; }
        .skeleton-line--mid { width: 35%; height: 12px; }

        .app-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            transition: background 150ms ease, border-color 150ms ease;
        }

        .app-card:hover {
            background: var(--surface-hover);
            border-color: rgba(52, 168, 83, 0.35);
        }

        .app-icon,
        .app-icon-fallback {
            width: 72px;
            height: 72px;
            flex: 0 0 72px;
            border-radius: 16px;
        }

        .app-icon {
            display: block;
            object-fit: cover;
        }

        .app-icon-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(150deg, #6ba0ff, #4c8dff 60%, #2f5fc4);
            color: #fff;
            font-size: 28px;
            font-weight: 700;
        }

        .app-content {
            display: flex;
            min-width: 0;
            flex: 1;
            flex-direction: column;
            gap: 4px;
        }

        .app-name {
            overflow: hidden;
            margin: 0;
            font-size: 17px;
            line-height: 1.3;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .app-meta {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
        }

        .app-description {
            display: -webkit-box;
            overflow: hidden;
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 13.5px;
            line-height: 1.45;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
        }

        .store-button {
            flex: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 9px 15px;
            border-radius: 10px;
            background: var(--accent);
            color: #fff;
            font-size: 13.5px;
            font-weight: 700;
            text-decoration: none;
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
            transition: background 150ms ease;
        }

        .store-button:hover {
            background: var(--accent-hover);
        }

        .store-button:active {
            transform: scale(0.98);
        }

        footer.page-footer {
            padding: 24px 0 40px;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 13px;
            text-align: center;
        }

        @media (max-width: 560px) {
            .app-card {
                align-items: flex-start;
                flex-wrap: wrap;
            }

            .app-icon,
            .app-icon-fallback {
                width: 60px;
                height: 60px;
                flex-basis: 60px;
                border-radius: 14px;
            }

            .app-content {
                flex-basis: calc(100% - 76px);
            }

            .store-button {
                margin-left: 76px;
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <header class="page-header">
            <p class="brand">Kervan Games</p>
            <h1>Oyunlarımız</h1>
            <p class="lead">Google Play'deki tüm oyunlarımız aşağıda otomatik olarak listelenir.</p>
            <p class="store-switch"><a href="../appstore/">App Store sürümünü gör →</a></p>
        </header>

        <main>
            <div id="status" class="status">
                <div>
                    <div class="loader"></div>
                    Oyunlar yükleniyor…
                </div>
            </div>

            <div id="skeletons" class="skeletons" hidden aria-hidden="true">
                <div class="skeleton-card">
                    <div class="skeleton-icon"></div>
                    <div class="skeleton-body">
                        <div class="skeleton-line skeleton-line--wide"></div>
                        <div class="skeleton-line skeleton-line--mid"></div>
                    </div>
                </div>
                <div class="skeleton-card">
                    <div class="skeleton-icon"></div>
                    <div class="skeleton-body">
                        <div class="skeleton-line skeleton-line--wide"></div>
                        <div class="skeleton-line skeleton-line--mid"></div>
                    </div>
                </div>
            </div>

            <div id="apps" class="apps" hidden></div>
        </main>

        <footer class="page-footer">
            <span id="footer-text">© Kervan Games</span>
        </footer>
    </div>

    <script>
        (function () {
            "use strict";

            // ---------------------------------------------------------------
            // Google Play'in geliştiricinin tüm oyunlarını listeleyen herkese
            // açık/anahtarsız bir API'si yok. Bu sayfa, zaten canlı çalışan
            // Apple Lookup API'sini TEK veri kaynağı olarak kullanır ve her
            // oyunun Google Play bağlantısını, Apple'ın döndürdüğü "bundleId"
            // alanından türetir (iOS ve Android sürümleri aynı paket/bundle
            // adını paylaştığı için). Google Play'e hiçbir istek atılmaz.
            //
            // ÖNEMLİ SINIRLAMA: iOS bundleId ile Android paket adı, Apple ve
            // Google tarafından birbirine eşit olacağı garanti edilen iki ayrı
            // kimlik alanıdır. Bu sadece Kervan Games'in bilerek ikisi için de
            // aynı adı kullanmasına dayanan bir varsayımdır. bundleId farklı
            // çıkarsa ya da eksikse, aşağıdaki kod kırık bir linke değil,
            // Google Play arama sayfasına yönlendirir.
            // ---------------------------------------------------------------

            var DEVELOPER_ID = "6793952593";
            var REQUEST_TIMEOUT_MS = 8000;

            // Ağ isteği tamamen başarısız olursa gösterilecek, bilinen gerçek
            // Google Play verisi (kullanıcı tarafından doğrulanmış).
            var fallbackApps = [
                {
                    trackName: "Orbiter",
                    primaryGenreName: "Arcade",
                    description: "Zamanlama, sinir ve iki halka arasındaki boşlukla ilgili hızlı, minimalist bir arcade oyunu. Boşluğu hizalayın, içinden geçin ve zinciri canlı tutun.",
                    formattedPrice: "Ücretsiz",
                    artworkUrl512: "",
                    bundleId: "com.kervan.orbiter"
                }
            ];

            var statusElement = document.getElementById("status");
            var skeletonsElement = document.getElementById("skeletons");
            var appsElement = document.getElementById("apps");
            var footerText = document.getElementById("footer-text");

            footerText.textContent = "© " + new Date().getFullYear() + " Kervan Games";

            var isAndroid = /Android/i.test(navigator.userAgent);

            function escapeHTML(value) {
                return String(value == null ? "" : value).replace(/[&<>"']/g, function (character) {
                    var entities = { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#039;" };
                    return entities[character];
                });
            }

            // Android paket adları: en az bir nokta içeren, küçük harf/rakam/
            // alt çizgi/nokta dışında karakter barındırmayan dizgiler olmalı.
            var PACKAGE_NAME_PATTERN = /^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$/i;

            function isLikelyPackageName(value) {
                return typeof value === "string" && PACKAGE_NAME_PATTERN.test(value.trim());
            }

            function getPlayStoreURL(app) {
                if (isLikelyPackageName(app.bundleId)) {
                    return "https://play.google.com/store/apps/details?id=" + encodeURIComponent(app.bundleId.trim());
                }
                // bundleId yoksa ya da paket adına benzemiyorsa, kırık bir
                // link göstermek yerine güvenli bir arama sayfasına düş.
                return "https://play.google.com/store/search?q=" + encodeURIComponent(app.trackName || "Kervan Games") + "&c=apps";
            }

            function formatPrice(app) {
                if (app.formattedPrice) {
                    return app.formattedPrice;
                }
                if (app.price === 0) {
                    return "Ücretsiz";
                }
                return "Google Play'de gör";
            }

            function createAppCard(app) {
                var name = escapeHTML(app.trackName || "Kervan Games");
                var genre = escapeHTML(app.primaryGenreName || "Oyun");
                var price = escapeHTML(formatPrice(app));
                var description = escapeHTML(app.description || "Oyunu Google Play üzerinden görüntüleyebilirsin.");
                var storeURL = escapeHTML(getPlayStoreURL(app));
                var linkTarget = isAndroid ? "" : ' target="_blank" rel="noopener noreferrer"';
                var linkAriaLabel = escapeHTML(name + " uygulamasını Google Play'de görüntüle");

                var iconHTML;
                if (app.artworkUrl512 || app.artworkUrl100) {
                    var iconSrc = escapeHTML(app.artworkUrl512 || app.artworkUrl100);
                    iconHTML = '<img class="app-icon" src="' + iconSrc + '" alt="" loading="lazy">';
                } else {
                    iconHTML = '<div class="app-icon-fallback" aria-hidden="true">' +
                        escapeHTML(name.charAt(0).toUpperCase()) + "</div>";
                }

                var metaText = genre + " · " + price;

                return (
                    '<article class="app-card">' +
                        iconHTML +
                        '<div class="app-content">' +
                            '<h2 class="app-name">' + name + "</h2>" +
                            '<p class="app-meta">' + metaText + "</p>" +
                            '<p class="app-description">' + description + "</p>" +
                        "</div>" +
                        '<a class="store-button" href="' + storeURL + '" aria-label="' + linkAriaLabel + '"' + linkTarget + ">" +
                            "Google Play\u2019de Gör" +
                        "</a>" +
                    "</article>"
                );
            }

            function normalizeApps(rawResults) {
                if (!Array.isArray(rawResults)) {
                    return [];
                }

                var filtered = rawResults.filter(function (result) {
                    return result &&
                        result.wrapperType === "software" &&
                        result.kind === "software" &&
                        String(result.artistId) === DEVELOPER_ID &&
                        result.trackId != null;
                });

                var deduped = Array.from(
                    new Map(filtered.map(function (app) { return [app.trackId, app]; })).values()
                );

                deduped.sort(function (a, b) {
                    var dateA = new Date(a.currentVersionReleaseDate || a.releaseDate || 0).getTime();
                    var dateB = new Date(b.currentVersionReleaseDate || b.releaseDate || 0).getTime();
                    return dateB - dateA;
                });

                return deduped;
            }

            function renderApps(apps) {
                var list = apps && apps.length ? apps : fallbackApps;

                appsElement.innerHTML = list.map(createAppCard).join("");

                statusElement.hidden = true;
                skeletonsElement.hidden = true;
                appsElement.hidden = false;
            }

            function fetchDeveloperApps(onSettled) {
                var settled = false;
                var scriptEl = null;
                var timeoutId = null;
                var callbackName = "__kervanPlayCallback_" + Date.now() + "_" + Math.floor(Math.random() * 1e6);

                function cleanup() {
                    if (timeoutId !== null) {
                        window.clearTimeout(timeoutId);
                        timeoutId = null;
                    }
                    if (scriptEl && scriptEl.parentNode) {
                        scriptEl.parentNode.removeChild(scriptEl);
                    }
                    try {
                        delete window[callbackName];
                    } catch (error) {
                        window[callbackName] = undefined;
                    }
                }

                function finish(apps) {
                    if (settled) {
                        return;
                    }
                    settled = true;
                    cleanup();
                    onSettled(apps);
                }

                window[callbackName] = function (response) {
                    finish(normalizeApps(response && response.results));
                };

                timeoutId = window.setTimeout(function () {
                    finish(null);
                }, REQUEST_TIMEOUT_MS);

                scriptEl = document.createElement("script");
                scriptEl.src = "https://itunes.apple.com/lookup" +
                    "?id=" + encodeURIComponent(DEVELOPER_ID) +
                    "&entity=software" +
                    "&country=tr" +
                    "&limit=200" +
                    "&_=" + Date.now() +
                    "&callback=" + callbackName;
                scriptEl.async = true;
                scriptEl.onerror = function () {
                    finish(null);
                };

                document.body.appendChild(scriptEl);
            }

            window.handleDeveloperApps = function (response) {
                renderApps(normalizeApps(response && response.results));
            };

            statusElement.hidden = true;
            skeletonsElement.hidden = false;

            fetchDeveloperApps(function (freshApps) {
                if (freshApps && freshApps.length) {
                    renderApps(freshApps);
                } else {
                    renderApps(null);
                }
            });
        })();
    </script>
</body>
</html>
