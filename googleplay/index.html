<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#0d0f14">

    <title>Kervan Games – Oyunlarımız (Google Play)</title>
    <meta name="description" content="Kervan Games tarafından geliştirilen mobil oyunları keşfedin ve Google Play'den indirin.">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Kervan Games">
    <meta property="og:title" content="Kervan Games – Oyunlarımız (Google Play)">
    <meta property="og:description" content="Kervan Games tarafından geliştirilen mobil oyunları keşfedin ve Google Play'den indirin.">

    <style>
        :root {
            color-scheme: dark;
            --bg: #0d0f14;
            --surface: #16181f;
            --surface-hover: #1c1f28;
            --border: rgba(255, 255, 255, 0.08);
            --ink: #f2f2f2;
            --muted: #9aa0ab;
            --accent: #4c8dff;
            --accent-hover: #6ba0ff;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .wrap {
            width: min(100%, 860px);
            margin: 0 auto;
            padding: 0 20px;
        }

        header.page-header {
            padding: 48px 0 32px;
            border-bottom: 1px solid var(--border);
        }

        .brand {
            margin: 0 0 18px;
            font-size: 15px;
            font-weight: 700;
            color: var(--muted);
        }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(28px, 4.5vw, 38px);
            letter-spacing: -0.02em;
        }

        .lead {
            margin: 0;
            max-width: 60ch;
            color: var(--muted);
            font-size: 15.5px;
            line-height: 1.6;
        }

        main {
            padding: 32px 0 40px;
        }

        .apps {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .app-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            transition: background 150ms ease, border-color 150ms ease;
        }

        .app-card:hover {
            background: var(--surface-hover);
            border-color: rgba(76, 141, 255, 0.35);
        }

        .app-icon,
        .app-icon-fallback {
            width: 72px;
            height: 72px;
            flex: 0 0 72px;
            border-radius: 16px;
        }

        .app-icon {
            display: block;
            object-fit: cover;
        }

        .app-icon-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(150deg, #6ba0ff, #4c8dff 60%, #2f5fc4);
            color: #fff;
            font-size: 28px;
            font-weight: 700;
        }

        .app-content {
            display: flex;
            min-width: 0;
            flex: 1;
            flex-direction: column;
            gap: 4px;
        }

        .app-name {
            overflow: hidden;
            margin: 0;
            font-size: 17px;
            line-height: 1.3;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .app-meta {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
        }

        .app-description {
            display: -webkit-box;
            overflow: hidden;
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 13.5px;
            line-height: 1.45;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
        }

        .store-button {
            flex: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 9px 15px;
            border-radius: 10px;
            background: var(--accent);
            color: #fff;
            font-size: 13.5px;
            font-weight: 700;
            text-decoration: none;
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
            transition: background 150ms ease;
        }

        .store-button:hover {
            background: var(--accent-hover);
        }

        .store-button:active {
            transform: scale(0.98);
        }

        footer.page-footer {
            padding: 24px 0 40px;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 13px;
            text-align: center;
        }

        @media (max-width: 560px) {
            .app-card {
                align-items: flex-start;
                flex-wrap: wrap;
            }

            .app-icon,
            .app-icon-fallback {
                width: 60px;
                height: 60px;
                flex-basis: 60px;
                border-radius: 14px;
            }

            .app-content {
                flex-basis: calc(100% - 76px);
            }

            .store-button {
                margin-left: 76px;
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <header class="page-header">
            <p class="brand">Kervan Games</p>
            <h1>Oyunlarımız</h1>
            <p class="lead">Google Play'deki tüm oyunlarımız aşağıda listelenir.</p>
        </header>

        <main>
            <div id="apps" class="apps"></div>
        </main>

        <footer class="page-footer">
            <span id="footer-text">© Kervan Games</span>
        </footer>
    </div>

    <script>
        (function () {
            "use strict";

            // Google Play, geliştiricinin tüm oyunlarını anahtarsız/CORS'a uygun
            // şekilde döndüren herkese açık bir API sunmuyor (Play Developer API
            // OAuth + servis hesabı gizli anahtarı gerektiriyor ve bunu statik bir
            // sitede istemci tarafında saklamak güvenlik açığı olur). Bu yüzden
            // liste burada elle güncellenir: yeni oyun çıktığında bu diziye bir
            // satır eklemek yeterlidir.
            var games = [
                {
                    name: "Orbiter",
                    category: "Arcade",
                    price: "Ücretsiz",
                    note: "Reklam içerir",
                    description: "Zamanlama, sinir ve iki halka arasındaki boşlukla ilgili hızlı, minimalist bir arcade oyunu. Boşluğu hizalayın, içinden geçin ve zinciri canlı tutun.",
                    iconUrl: "",
                    storeUrl: "https://play.google.com/store/apps/details?id=com.kervan.orbiter"
                }
            ];

            var appsElement = document.getElementById("apps");
            var footerText = document.getElementById("footer-text");

            footerText.textContent = "© " + new Date().getFullYear() + " Kervan Games";

            var isAndroid = /Android/i.test(navigator.userAgent);

            function escapeHTML(value) {
                return String(value == null ? "" : value).replace(/[&<>"']/g, function (character) {
                    var entities = { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#039;" };
                    return entities[character];
                });
            }

            function isSafePlayStoreURL(value) {
                if (typeof value !== "string") {
                    return false;
                }
                try {
                    var parsed = new URL(value, window.location.href);
                    return parsed.protocol === "https:" && parsed.hostname === "play.google.com";
                } catch (error) {
                    return false;
                }
            }

            function createAppCard(game) {
                var name = escapeHTML(game.name || "Kervan Games");
                var category = escapeHTML(game.category || "Oyun");
                var price = escapeHTML(game.price || "Google Play'de gör");
                var note = game.note ? escapeHTML(game.note) : "";
                var description = escapeHTML(game.description || "Oyunu Google Play üzerinden görüntüleyebilirsin.");
                var storeURL = isSafePlayStoreURL(game.storeUrl) ? escapeHTML(game.storeUrl) : "";
                var linkTarget = isAndroid ? "" : ' target="_blank" rel="noopener noreferrer"';
                var linkAriaLabel = escapeHTML(name + " uygulamasını Google Play'de görüntüle");

                var iconHTML;
                if (game.iconUrl) {
                    iconHTML = '<img class="app-icon" src="' + escapeHTML(game.iconUrl) + '" alt="" loading="lazy">';
                } else {
                    iconHTML = '<div class="app-icon-fallback" aria-hidden="true">' +
                        escapeHTML(name.charAt(0).toUpperCase()) + "</div>";
                }

                var metaText = category + " · " + price + (note ? " · " + note : "");

                var buttonHTML = storeURL
                    ? '<a class="store-button" href="' + storeURL + '" aria-label="' + linkAriaLabel + '"' + linkTarget + ">Google Play\u2019de Gör</a>"
                    : "";

                return (
                    '<article class="app-card">' +
                        iconHTML +
                        '<div class="app-content">' +
                            '<h2 class="app-name">' + name + "</h2>" +
                            '<p class="app-meta">' + metaText + "</p>" +
                            '<p class="app-description">' + description + "</p>" +
                        "</div>" +
                        buttonHTML +
                    "</article>"
                );
            }

            appsElement.innerHTML = games.map(createAppCard).join("");
        })();
    </script>
</body>
</html>
