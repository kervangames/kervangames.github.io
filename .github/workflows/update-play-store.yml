name: Update Play Store data

on:
  schedule:
    - cron: "13 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-play-store
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Play Store update script
        run: npm run update-play-store

      - name: Commit and push changes if data changed
        run: |
          if [ -n "$(git status --porcelain -- data/playstore-apps.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/playstore-apps.json
            git commit -m "chore: Google Play oyun verisini güncelle"
            git push origin "HEAD:${{ github.ref_name }}"
          else
            echo "Google Play verisinde değişiklik yok, commit atlanıyor."
          fi
