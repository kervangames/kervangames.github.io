<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">

    <title>Kervan Games – Oyunlarımız</title>

    <meta
        name="description"
        content="Kervan Games tarafından geliştirilen oyunları keşfet."
    >

    <style>
        :root {
            color-scheme: dark;
            --background: #08090d;
            --surface: #12141b;
            --surface-hover: #181b24;
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --muted: #9da3b0;
            --blue: #087ff5;
            --blue-hover: #2692ff;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: var(--background);
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 50% -20%,
                    rgba(8, 127, 245, 0.22),
                    transparent 42%
                ),
                var(--background);
            color: var(--text);
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
        }

        .page {
            width: min(100%, 980px);
            margin: 0 auto;
            padding: 64px 20px 48px;
        }

        .header {
            margin-bottom: 40px;
            text-align: center;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
            color: #82bdff;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .brand-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--blue);
            box-shadow: 0 0 18px rgba(8, 127, 245, 0.9);
        }

        h1 {
            margin: 0;
            font-size: clamp(36px, 7vw, 64px);
            line-height: 1.05;
            letter-spacing: -0.045em;
        }

        .header-description {
            max-width: 560px;
            margin: 18px auto 0;
            color: var(--muted);
            font-size: 17px;
            line-height: 1.6;
        }

        .status {
            display: flex;
            min-height: 180px;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            text-align: center;
        }

        .loader {
            width: 30px;
            height: 30px;
            margin: 0 auto 14px;
            border: 3px solid rgba(255, 255, 255, 0.12);
            border-top-color: var(--blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .apps {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .app-card {
            display: flex;
            min-width: 0;
            gap: 18px;
            padding: 20px;
            border: 1px solid var(--border);
            border-radius: 22px;
            background: rgba(18, 20, 27, 0.88);
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            transition:
                transform 160ms ease,
                border-color 160ms ease,
                background 160ms ease;
        }

        .app-card:hover {
            transform: translateY(-3px);
            border-color: rgba(8, 127, 245, 0.35);
            background: var(--surface-hover);
        }

        .app-icon,
        .app-icon-fallback {
            width: 104px;
            height: 104px;
            flex: 0 0 104px;
            border-radius: 23px;
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.35);
        }

        .app-icon {
            display: block;
            object-fit: cover;
        }

        .app-icon-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                linear-gradient(
                    145deg,
                    rgba(38, 146, 255, 1),
                    rgba(76, 52, 255, 1)
                );
            color: #ffffff;
            font-size: 40px;
            font-weight: 800;
        }

        .app-content {
            display: flex;
            min-width: 0;
            flex: 1;
            flex-direction: column;
        }

        .app-name {
            overflow: hidden;
            margin: 1px 0 5px;
            font-size: 20px;
            line-height: 1.25;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .app-meta {
            margin: 0 0 10px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.4;
        }

        .app-description {
            display: -webkit-box;
            overflow: hidden;
            margin: 0 0 16px;
            color: #c3c7d0;
            font-size: 14px;
            line-height: 1.45;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
        }

        .store-button {
            display: inline-flex;
            width: fit-content;
            align-items: center;
            justify-content: center;
            margin-top: auto;
            padding: 10px 15px;
            border-radius: 11px;
            background: var(--blue);
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
            transition:
                background 150ms ease,
                transform 150ms ease;
        }

        .store-button:hover {
            background: var(--blue-hover);
        }

        .store-button:active {
            transform: scale(0.97);
        }

        .footer {
            margin-top: 42px;
            color: #656b77;
            font-size: 13px;
            text-align: center;
        }

        @media (max-width: 760px) {
            .page {
                padding-top: 42px;
            }

            .apps {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 440px) {
            .app-card {
                gap: 15px;
                padding: 16px;
                border-radius: 19px;
            }

            .app-icon,
            .app-icon-fallback {
                width: 86px;
                height: 86px;
                flex-basis: 86px;
                border-radius: 20px;
            }

            .app-name {
                font-size: 18px;
            }

            .app-description {
                -webkit-line-clamp: 1;
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <header class="header">
            <div class="brand">
                <span class="brand-dot"></span>
                Kervan Games
            </div>

            <h1>Oyunlarımız</h1>

            <p class="header-description">
                Kervan Games tarafından geliştirilen oyunları keşfet
                ve App Store’dan hemen indir.
            </p>
        </header>

        <div id="status" class="status">
            <div>
                <div class="loader"></div>
                Oyunlar yükleniyor…
            </div>
        </div>

        <main id="apps" class="apps" hidden></main>

        <footer class="footer">
            © Kervan Games
        </footer>
    </div>

    <script>
        const developerId = "6793952593";

        const fallbackApps = [
            {
                trackId: 6793952591,
                trackName: "Orbiter: Ring Rush",
                primaryGenreName: "Casual",
                description:
                    "Halkalardan geç, reflekslerini test et ve en yüksek skora ulaş.",
                formattedPrice: "Ücretsiz",
                artworkUrl512: "",
                trackViewUrl:
                    "https://apps.apple.com/tr/app/orbiter-ring-rush/id6793952591"
            }
        ];

        const statusElement = document.getElementById("status");
        const appsElement = document.getElementById("apps");

        const isIOS =
            /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
            (
                navigator.platform === "MacIntel" &&
                navigator.maxTouchPoints > 1
            );

        function escapeHTML(value) {
            return String(value ?? "").replace(
                /[&<>"']/g,
                function (character) {
                    const entities = {
                        "&": "&amp;",
                        "<": "&lt;",
                        ">": "&gt;",
                        "\"": "&quot;",
                        "'": "&#039;"
                    };

                    return entities[character];
                }
            );
        }

        function getStoreURL(app) {
            const fallbackURL =
                "https://apps.apple.com/tr/app/id" + app.trackId;

            const webURL = app.trackViewUrl || fallbackURL;

            if (!isIOS) {
                return webURL;
            }

            return webURL.replace(
                /^https?:\/\/apps\.apple\.com/i,
                "itms-apps://apps.apple.com"
            );
        }

        function getTargetAttribute() {
            if (isIOS) {
                return "";
            }

            return ' target="_blank" rel="noopener noreferrer"';
        }

        function createAppCard(app) {
            const name = escapeHTML(app.trackName || "Kervan Games");
            const genre = escapeHTML(
                app.primaryGenreName || "Oyun"
            );
            const price = escapeHTML(
                app.formattedPrice || "App Store"
            );
            const description = escapeHTML(
                app.description ||
                "Oyunu App Store üzerinden görüntüleyebilirsin."
            );
            const storeURL = escapeHTML(getStoreURL(app));

            let iconHTML;

            if (app.artworkUrl512) {
                iconHTML = `
                    <img
                        class="app-icon"
                        src="${escapeHTML(app.artworkUrl512)}"
                        alt="${name} uygulama ikonu"
                        loading="lazy"
                    >
                `;
            } else {
                iconHTML = `
                    <div class="app-icon-fallback" aria-hidden="true">
                        ${escapeHTML(name.charAt(0).toUpperCase())}
                    </div>
                `;
            }

            return `
                <article class="app-card">
                    ${iconHTML}

                    <div class="app-content">
                        <h2 class="app-name">${name}</h2>

                        <p class="app-meta">
                            ${genre} · ${price}
                        </p>

                        <p class="app-description">
                            ${description}
                        </p>

                        <a
                            class="store-button"
                            href="${storeURL}"
                            ${getTargetAttribute()}
                        >
                            App Store’da Gör
                        </a>
                    </div>
                </article>
            `;
        }

        function displayApps(apps) {
            const uniqueApps = Array.from(
                new Map(
                    apps.map(function (app) {
                        return [app.trackId, app];
                    })
                ).values()
            );

            uniqueApps.sort(function (firstApp, secondApp) {
                const firstDate = new Date(
                    firstApp.currentVersionReleaseDate ||
                    firstApp.releaseDate ||
                    0
                );

                const secondDate = new Date(
                    secondApp.currentVersionReleaseDate ||
                    secondApp.releaseDate ||
                    0
                );

                return secondDate - firstDate;
            });

            appsElement.innerHTML = uniqueApps
                .map(createAppCard)
                .join("");

            statusElement.hidden = true;
            appsElement.hidden = false;
        }

        function handleDeveloperApps(response) {
            const apps = Array.isArray(response.results)
                ? response.results.filter(function (result) {
                    return (
                        result.kind === "software" &&
                        String(result.artistId) === developerId
                    );
                })
                : [];

            if (apps.length > 0) {
                displayApps(apps);
                return;
            }

            displayApps(fallbackApps);
        }

        function handleLookupError() {
            displayApps(fallbackApps);
        }

        const lookupScript = document.createElement("script");

        lookupScript.src =
            "https://itunes.apple.com/lookup" +
            "?id=" + encodeURIComponent(developerId) +
            "&entity=software" +
            "&country=tr" +
            "&limit=200" +
            "&callback=handleDeveloperApps";

        lookupScript.async = true;
        lookupScript.onerror = handleLookupError;

        document.body.appendChild(lookupScript);
    </script>
</body>
</html>
