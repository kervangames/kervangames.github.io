<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Kervan Games – App Store</title>

    <script>
        const webURL =
            "https://apps.apple.com/tr/developer/emir-furkan-yasar/id6793952593?l=tr";

        const isIOS =
            /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
            (
                navigator.platform === "MacIntel" &&
                navigator.maxTouchPoints > 1
            );

        if (!isIOS) {
            window.location.replace(webURL);
        }
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #0b0b0f;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            text-align: center;
        }

        main {
            width: 100%;
            max-width: 420px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 27px;
        }

        p {
            margin: 0 0 26px;
            color: #a8a8b3;
            font-size: 16px;
            line-height: 1.5;
        }

        a {
            display: block;
            width: 100%;
            padding: 17px 20px;
            border-radius: 14px;
            background: #087ff5;
            color: #ffffff;
            text-decoration: none;
            font-size: 18px;
            font-weight: 650;
            -webkit-tap-highlight-color: transparent;
        }

        a:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>
    <main>
        <h1>Kervan Games</h1>

        <p>
            Oyunlarımızı görüntülemek için App Store’u aç.
        </p>

        <a href="itms-apps://itunes.apple.com/tr/developer/emir-furkan-yasar/id6793952593">
            App Store’da Aç
        </a>
    </main>
</body>
</html>
